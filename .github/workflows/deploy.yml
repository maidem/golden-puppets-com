name: Build & Deploy to Netcorp

on:
    # Ausgelöst durch den Storyblok-Webhook via PHP-Bridge
    repository_dispatch:
        types: [storyblok_publish]
    # Manueller Start über GitHub UI
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Generate static site
              run: npm run generate
              env:
                  STORYBLOK_DELIVERY_API_TOKEN: ${{ secrets.STORYBLOK_DELIVERY_API_TOKEN }}

            - name: Install rsync
              run: sudo apt-get install -y rsync

            - name: Deploy to Netcorp via rsync (SSH)
              run: |
                  # SSH-Key aus Secret einrichten
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

                  rsync -az --delete \
                    -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
                    .output/public/ \
                    ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_REMOTE_DIR }}
