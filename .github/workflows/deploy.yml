name: Build & Deploy

on:
  # Ausgelöst durch den Storyblok-Webhook via PHP-Bridge
  repository_dispatch:
    types: [storyblok_publish]
  # Automatisch bei Code-Push auf main
  push:
    branches:
      - main
  # Manueller Start über GitHub UI
  workflow_dispatch:

jobs:
  # ── Job 1: Statisches Deployment → Netcorp (Produktion) ───────────────────
  deploy-production:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          STORYBLOK_DELIVERY_API_TOKEN: ${{ secrets.STORYBLOK_DELIVERY_API_TOKEN }}

      - name: Deploy to Netcorp via SSH/tar
        run: |
          # SSH-Key aus Secret einrichten
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

          # Dateien als tar-Stream übertragen und remote entpacken
          # webhook/ und .htaccess werden ausgeschlossen (liegen dauerhaft auf dem Server)
          tar -czf - -C .output/public --exclude=./webhook . | \
            ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=no \
                ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
                "mkdir -p ${{ secrets.SSH_REMOTE_DIR }} && tar -xzf - -C ${{ secrets.SSH_REMOTE_DIR }}"

  # ── Job 2: Docker-Image → ghcr.io + Coolify via Tailscale (Preview) ───────
  # Läuft nur bei Code-Änderungen, NICHT bei reinen Content-Publishes.
  # Der SSR-Server fetcht Draft-Inhalte dynamisch – kein Rebuild nötig.
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write # für ghcr.io push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag: ghcr.io/<org-oder-user>/golden-puppets-preview:latest
          tags: ghcr.io/${{ github.repository_owner }}/golden-puppets-preview:latest
          # Token via Docker Build Secret – landet nie als Image-Layer
          secrets: |
            storyblok_token=${{ secrets.STORYBLOK_PREVIEW_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Coolify redeploy
        run: |
          curl --fail -s -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}"
